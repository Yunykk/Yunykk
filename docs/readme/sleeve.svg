<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330">
  <title>Yunykk — keep it local</title>
  <desc>A cream and orange record sleeve with a black vinyl record, a cropped Yunykk wordmark and a small 440 Hz reference.</desc>
  <defs>
    <pattern id="paper" width="7" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 1h2m3 3h2" stroke="#241c16" stroke-opacity=".13" stroke-width=".6"/>
    </pattern>
    <clipPath id="sleeve"><rect x="1" y="1" width="878" height="328" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#sleeve)">
    <path fill="#f7edd8" d="M0 0h880v330H0z"/>
    <path fill="#fb7545" d="M0 246h880v84H0z"/>
    <path fill="url(#paper)" d="M0 0h880v330H0z"/>
    <g transform="translate(693 150)">
      <circle r="200" fill="#211c18" stroke="#211c18" stroke-width="3"/>
      <g fill="none" stroke="#f7edd8" opacity=".27">
        <circle r="192"/><circle r="184"/><circle r="174"/><circle r="164"/><circle r="156"/><circle r="146"/><circle r="134"/><circle r="126"/><circle r="114"/><circle r="105"/><circle r="96"/><circle r="87"/>
      </g>
      <path d="M-148-113a186 186 0 0 1 122-71M131 118a176 176 0 0 1-104 56" fill="none" stroke="#f7edd8" stroke-width="3" opacity=".6"/>
      <circle r="77" fill="#fb7545"/>
      <circle r="62" fill="url(#paper)" stroke="#211c18"/>
      <path d="M-30 2h12l7-13 10 25L9-9l7 11h14" fill="none" stroke="#211c18" stroke-linejoin="round" stroke-width="3"/>
      <circle r="4" fill="#f7edd8"/>
      <path d="M-76 27h152" stroke="#211c18" opacity=".42"/>
      <text x="0" y="48" text-anchor="middle" fill="#211c18" font-family="monospace" font-size="15" font-weight="700">A4 / 440</text>
    </g>
    <path d="M34 55h409M34 220h409" stroke="#211c18"/>
    <g fill="#211c18" font-family="monospace">
      <text x="35" y="40" font-size="21" letter-spacing="2">@YUNYKK</text>
      <text x="36" y="291" font-size="22" font-weight="700">MUSIC / FOCUS / TIME</text>
    </g>
    <g fill="#211c18" font-family="Arial, Helvetica, sans-serif" font-weight="900" letter-spacing="-4">
      <text x="29" y="125" font-size="78">keep it</text>
      <text x="29" y="200" font-size="97">local.</text>
    </g>
  </g>
  <rect x="1" y="1" width="878" height="328" rx="10" fill="none" stroke="#211c18" stroke-width="2"/>
</svg>
